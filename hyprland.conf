###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/

################
### INCLUDES ###
################

source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/look-and-feel.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/windowrules.conf

# Por último, para poder sobrescrever o que vem acima: ajustes de cada
# máquina (teclado, escala, wallpaper). Gitignored; ver conf/local.conf.example.
source = ~/.config/hypr/conf/local.conf
