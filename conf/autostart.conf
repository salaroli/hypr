#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = awww-daemon

# Clipboard history (precisa rodar pra capturar)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# KWallet: Hyprland não lê autostart do XDG (/etc/xdg/autostart), então
# quem desbloqueia a carteira com a senha de login (capturada pelo PAM no
# SDDM) precisa ser disparado manualmente aqui.
exec-once = /usr/lib/pam_kwallet_init

