#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = awww-daemon
# Wallpaper vem do repo dotfiles (~/Pictures/wallpapers é link para ele).
exec-once = sleep 1 && awww img ~/Pictures/wallpapers/windmill.jpg

# Notificações (central com "limpar tudo": SUPER+N / SUPER+SHIFT+N)
exec-once = swaync

# Clipboard history (precisa rodar pra capturar)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# KWallet: Hyprland não lê autostart do XDG (/etc/xdg/autostart), então
# quem desbloqueia a carteira com a senha de login (capturada pelo PAM no
# SDDM) precisa ser disparado manualmente aqui.
exec-once = /usr/lib/pam_kwallet_init

